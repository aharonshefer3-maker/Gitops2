apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: redis
    targetRevision: 19.x.x # גרסת הצ'ארט
    helm:
      valueFiles:
        # כאן ארגו מושך את הקונפיגורציה שלך מהתיקייה שצילמת
#        - 'https://github.com/ronaelshef3/GITops1/infrastructure//values.yaml'
        - "https://raw.githubusercontent.com/ronaelshef3/GitOps1/master/infrastructure/redis/values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: database # או איפה שאתה רוצה שה-Redis ירוץ
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true