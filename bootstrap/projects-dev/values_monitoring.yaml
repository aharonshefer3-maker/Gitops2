# פתרון הקונפליקטים: ביטול Webhooks ו-TLS
prometheusOperator:
  admissionWebhooks:
    enabled: false
  patch:
    enabled: false
  tls:
    enabled: false

# חיסכון במשאבים
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
alertmanager:
  enabled: false

# הגדרות Prometheus + NodePort 30002 לתפור ל-SG
prometheus:
  prometheusSpec:
    scrapeInterval: "30s"
    resources:
      limits:
        cpu: "200m"
        memory: "1Gi"
    additionalScrapeConfigs:
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
  service:
    type: NodePort
    nodePort: 30002

# הגדרות Grafana + NodePort 30001 לתפור ל-SG
grafana:
  resources:
    limits:
      cpu: "100m"
      memory: "512Mi"
  service:
    type: NodePort
    nodePort: 30001